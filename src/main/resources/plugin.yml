name: M10PracticeMenu
version: 1.0.0
main: com.example.m10practice.Main
api-version: '1.21.8'

depend:
  - ModelEngine

commands:
  m10menu:
    description: テスト用コマンド
    usage: /m10menu

  spawnminigolem:
    description: MiniGolemを召喚します
    usage: /spawnminigolem
    permission: m10practice.spawnminigolem

  spawnsantagirl:
    description: SantaGirlを召喚します
    usage: /spawnsantagirl
    permission: m10practice.spawnsantagirl

  spawnreindeer:
    description: トナカイを召喚します
    usage: /spawnreindeer
    permission: m10practice.admin
    
  startreindeergame:
    description: トナカイ射的ゲームを開始
    usage: /startreindeergame
    permission: m10practice.admin

  spawngorilla:
    description: 暴走ゴリラを召喚して攻撃をテスト
    usage: /spawngorilla
    permission: m10practice.admin

  removegorilla:
    description: 暴走ゴリラをモデルとBossBarごと一括削除
    usage: /removegorilla
    permission: m10practice.admin

permissions:
  m10practice.spawnminigolem:
    default: op

  m10practice.spawnsantagirl:
    default: op

  m10practice.admin:
    default: op